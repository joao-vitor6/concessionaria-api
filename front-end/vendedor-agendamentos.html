<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Agendamentos — Vendedor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="vendedor-agendamentos.html" class="navbar-brand">CONCESSIONÁRIA · VENDEDOR</a>
    <div class="admin-nav-links">
      <a href="vendedor-agendamentos.html" class="active">Meus Agendamentos</a>
      <a href="vendedor-vendas.html">Minhas Vendas</a>
    </div>
    <div class="navbar-actions">
      <button id="btn-logout" class="btn-ghost">Sair</button>
    </div>
  </nav>

  <div class="page-content">
    <div class="page-header">
      <h1>Meus agendamentos</h1>
      <p>Visitas agendadas com você.</p>
    </div>

    <div id="mensagem" class="form-message"></div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Carro</th>
          <th>Data</th>
          <th>Status</th>
          <th style="min-width: 180px;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-agendamentos"></tbody>
    </table>
  </div>

  <div id="venda-overlay" class="modal-overlay">
    <div class="prompt-card">
      <h3>Registrar venda</h3>
      <p class="subtitle">Confirme os dados da venda para este cliente.</p>
      <div class="field">
        <label for="venda-valor">Valor pago</label>
        <input type="number" step="0.01" id="venda-valor">
      </div>
      <div class="field">
        <label for="venda-data">Data da venda</label>
        <input type="date" id="venda-data">
      </div>
      <div class="form-actions">
        <button id="venda-confirmar" class="btn-primary" style="width: auto;">Registrar</button>
        <button id="venda-cancelar" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="alerta-overlay" class="modal-overlay">
    <div class="prompt-card">
      <h3 id="alerta-titulo">Aviso</h3>
      <p id="alerta-mensagem" class="subtitle"></p>
      <div class="form-actions">
        <button id="alerta-ok" class="btn-primary" style="width: auto;">OK</button>
      </div>
    </div>
  </div>

  <div id="confirmar-overlay" class="modal-overlay">
    <div class="prompt-card">
      <h3 id="confirmar-titulo">Confirmar</h3>
      <p id="confirmar-mensagem" class="subtitle"></p>
      <div class="form-actions">
        <button id="confirmar-sim" class="btn-primary" style="width: auto;">Confirmar</button>
        <button id="confirmar-nao" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/vendedor-agendamentos.js"></script>
</body>
</html>
