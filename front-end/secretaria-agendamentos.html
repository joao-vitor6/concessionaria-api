<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos — Secretária</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="secretaria-clientes.html" class="navbar-brand">CONCESSIONÁRIA · SECRETÁRIA</a>
    <div class="admin-nav-links">
      <a href="secretaria-clientes.html">Clientes</a>
      <a href="secretaria-agendamentos.html" class="active">Agendamentos</a>
    </div>
    <div class="navbar-actions">
      <button id="btn-logout" class="btn-ghost">Sair</button>
    </div>
  </nav>

  <div class="page-content">
    <div class="page-header-row">
      <div class="page-header" style="margin-bottom: 0;">
        <h1>Agendamentos</h1>
        <p>Veja a agenda de todos os vendedores e marque visitas presenciais.</p>
      </div>
      <button id="btn-novo" class="btn-secondary">+ Novo agendamento</button>
    </div>

    <div id="mensagem" class="form-message"></div>

    <div id="form-panel" class="form-panel">
      <h3>Novo agendamento presencial</h3>
      <form id="form-agendamento">
        <div class="form-grid">
          <div class="field">
            <label for="cliente-select">Cliente</label>
            <select id="cliente-select" required></select>
          </div>
          <div class="field">
            <label for="carro-select">Carro</label>
            <select id="carro-select" required></select>
          </div>
          <div class="field">
            <label for="vendedor-select">Vendedor</label>
            <select id="vendedor-select" required></select>
          </div>
          <div class="field">
            <label for="agendamento-data">Data</label>
            <input type="date" id="agendamento-data" required>
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label>Horários do vendedor</label>
            <div id="horarios-grid" class="horarios-grid"></div>
            <input type="hidden" id="agendamento-hora">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Agendar</button>
          <button type="button" id="btn-cancelar-form" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Vendedor</th>
          <th>Carro</th>
          <th>Data</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabela-agendamentos"></tbody>
    </table>
  </div>

  <div id="alerta-overlay" class="modal-overlay">
    <div class="prompt-card">
      <h3 id="alerta-titulo">Aviso</h3>
      <p id="alerta-mensagem" class="subtitle"></p>
      <div class="form-actions">
        <button id="alerta-ok" class="btn-primary" style="width: auto;">OK</button>
      </div>
    </div>
  </div>

  <script src="js/secretaria-agendamentos.js"></script>
</body>
</html>
