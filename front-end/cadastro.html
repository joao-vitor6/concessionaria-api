<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Concessionária</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-hero">
      <div class="auth-hero-brand">CONCESSIONÁRIA</div>
      <h1>Crie sua conta e acompanhe cada etapa da sua compra.</h1>
      <p>Cadastre-se para ver o catálogo completo e guardar o histórico das suas compras.</p>
    </div>

    <div class="auth-panel">
      <div class="auth-card">
        <h2>Criar conta</h2>
        <p class="subtitle">Preencha seus dados para começar.</p>

        <div id="mensagem" class="form-message"></div>

        <form id="form-cadastro">
          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required autocomplete="name">
          </div>
          <div class="field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" required placeholder="000.000.000-00">
          </div>
          <div class="field">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" required placeholder="(00) 00000-0000">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required autocomplete="new-password">
          </div>
          <div class="field">
            <label for="senha-compra">Senha de compra</label>
            <input type="password" id="senha-compra" required>
            <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 4px;">
              Usada para confirmar suas compras no site.
            </span>
          </div>
          <button type="submit" class="btn-primary">Criar conta</button>
        </form>

        <p class="auth-switch">Já tem conta? <a href="index.html">Entrar</a></p>
      </div>
    </div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
